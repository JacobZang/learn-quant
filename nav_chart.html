const SERIES = [
  {key:'gross', label:'策略(不含成本)', color:'var(--series-1)'},
  {key:'net',   label:'策略(含成本)',   color:'var(--series-2)'},
  {key:'bench', label:'等权 buy&hold',  color:'var(--series-3)'},
];
const W=860,H=420,m={l:46,r:18,t:16,b:30};
const iw=W-m.l-m.r, ih=H-m.t-m.b;
const n=DATA.dates.length;
let ys=SERIES.flatMap(s=>DATA[s.key]);
const ymin=Math.min(0.95,...ys), ymax=Math.max(...ys)*1.02;
const X=i=>m.l+i/(n-1)*iw;
const Y=v=>m.t+(1-(v-ymin)/(ymax-ymin))*ih;

const svg=document.getElementById('chart');
let g='';
for(let k=0;k<=4;k++){
  const v=ymin+(ymax-ymin)*k/4, y=Y(v);
  g+=`<line class="gridline" x1="${m.l}" y1="${y}" x2="${m.l+iw}" y2="${y}"/>`;
  g+=`<text class="tick" x="${m.l-6}" y="${y+3}" text-anchor="end">${v.toFixed(2)}</text>`;
}
const seen=new Set();
DATA.dates.forEach((d,i)=>{ const yr=d.slice(0,4); if(!seen.has(yr)){ seen.add(yr);
  g+=`<text class="tick" x="${X(i)}" y="${H-m.b+16}" text-anchor="middle">${yr}</text>`; }});
g+=`<line class="axisline" x1="${m.l}" y1="${m.t+ih}" x2="${m.l+iw}" y2="${m.t+ih}"/>`;
g+=`<line class="axisline" x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ih}"/>`;
SERIES.forEach(s=>{
  const d=DATA[s.key].map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
});
svg.innerHTML=g;

const legend=document.getElementById('legend');
SERIES.forEach(s=>{
  const v=DATA[s.key][n-1];
  legend.insertAdjacentHTML('beforeend',
    `<div class="item"><span class="sw" style="background:${s.color}"></span>${s.label}<span class="val">${((v-1)*100).toFixed(2)}%</span></div>`);
});

const tooltip=document.getElementById('tooltip');
const rootEl=document.querySelector('.viz-root');
svg.addEventListener('mousemove',e=>{
  const r=svg.getBoundingClientRect();
  const px=(e.clientX-r.left)*W/r.width-m.l;
  const i=Math.round(px/iw*(n-1));
  if(i<0||i>=n) return;
  const x=X(i);
  let ch=document.getElementById('crosshair');
  if(!ch){ ch=document.createElementNS('http://www.w3.org/2000/svg','line');
    ch.id='crosshair'; ch.setAttribute('class','crosshair'); svg.appendChild(ch); }
  ch.setAttribute('x1',x); ch.setAttribute('x2',x); ch.setAttribute('y1',m.t); ch.setAttribute('y2',m.t+ih);
  document.querySelectorAll('.dot').forEach(d=>d.remove());
  SERIES.forEach(s=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','dot'); c.setAttribute('cx',x); c.setAttribute('cy',Y(DATA[s.key][i]));
    c.setAttribute('r',4); c.setAttribute('fill',s.color); svg.appendChild(c);
  });
  tooltip.style.display='block';
  tooltip.innerHTML=`<div class="date">${DATA.dates[i]}</div>`+SERIES.map(s=>
    `<div class="row"><span>${s.label}</span><b>${((DATA[s.key][i]-1)*100).toFixed(2)}%</b></div>`).join('');
  const rr=rootEl.getBoundingClientRect();
  let lx=e.clientX-rr.left+14, ty=e.clientY-rr.top+14;
  if(lx+tooltip.offsetWidth>rr.width) lx=e.clientX-rr.left-tooltip.offsetWidth-8;
  tooltip.style.left=lx+'px'; tooltip.style.top=ty+'px';
});
svg.addEventListener('mouseleave',()=>{ tooltip.style.display='none';
  const ch=document.getElementById('crosshair'); if(ch)ch.remove();
  document.querySelectorAll('.dot').forEach(d=>d.remove()); });

const rows=[['总收益','+44.66%','+42.32%','+39.35%'],
            ['年化(CAGR)','+18.99%','+18.08%','+17.46%'],
            ['最大回撤','−22.75%','−22.80%','−23.63%']];
const tb=document.querySelector('#tbl tbody');
rows.forEach(r=>{ tb.insertAdjacentHTML('beforeend',
  `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`); });
